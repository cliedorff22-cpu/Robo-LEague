<!DOCTYPE html>
<!-- The phone build of the main menu, ported from ../index.html: keep the two in step. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Robo League">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>ROBO LEAGUE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Teko:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../css/menu.css">
<link rel="stylesheet" href="../css/theme-menu.css">
<!--
  The front end: main menu, Quick Fight, Settings, Credits, Career. The fight
  itself is fight.html. Only Three.js is needed here - the robot previews are
  posed from pure logic, so Rapier is not downloaded until you fight.
-->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
<link rel="stylesheet" href="mobile.css">
</head>
<body>
  <div id="app">
    <div class="loading" id="boot">
      <div class="logo">ROBO<span>LEAGUE</span></div>
      <p id="boot-status">loading...</p>
    </div>
  </div>
  <script>
  // Classic script: must work even when modules cannot load at all.
  if (location.protocol === "file:") {
    document.getElementById("boot").innerHTML =
      "<div class='logo'>ROBO<span>LEAGUE</span></div>" +
      "<p>Browsers refuse to load ES modules from <code>file://</code>.</p>" +
      "<p>From the project folder run <code>tools/serve.sh</code>, then open " +
      "<a href='http://localhost:8420/'>http://localhost:8420/</a></p>";
  }
  window.addEventListener("error", function (e) {
    if (window.__MENU_BOOTED__) return;
    document.getElementById("boot-status").textContent = "Failed to start: " + (e.message || e);
  });
  window.addEventListener("unhandledrejection", function (e) {
    if (window.__MENU_BOOTED__) return;
    var r = e.reason;
    document.getElementById("boot-status").textContent = "Failed to start: " + ((r && (r.stack || r.message)) || r);
  });
  </script>
  <script>
  // The phone build (mobile/): the game's shared code and data are one folder
  // up; this build keeps its own settings, starting lighter on the graphics.
  window.ROBO_MOBILE = {
    base: "../",
    settings: { bloom: false, shadows: false, renderScale: "0.75", hudDamage: false },
  };
  // Installed to the home screen: works offline once it has been played (sw.js).
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
</script>
<script type="module" src="../js/menu/menu.js"></script>
<script type="module" src="menu-touch.js"></script>
</body>
</html>
